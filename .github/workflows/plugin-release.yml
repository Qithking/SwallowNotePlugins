name: Plugin Release
run-name: plugin release

# 插件仓库独立发布：tag 触发（plugin-v*），三平台构建插件后端，
# 经 sdk/plugin-kit 的 package 命令打包签名（构建→确定性 zip→ed25519→repo.json 同步）
on:
  push:
    tags:
      - 'plugin-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        platform: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 插件后端按宿主 host_platform_dir() 约定的平台子目录落位（zip 双布局）
      - name: Build Plugin Backends (macOS)
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin
          for p in package/*/; do
            [ -d "$p/src-tauri" ] || continue
            echo "==> backend: $p"
            (cd "$p/src-tauri" && cargo build --release --target aarch64-apple-darwin)
            (cd "$p/src-tauri" && cargo build --release --target x86_64-apple-darwin)
            # 落到插件根 backend/<平台>/：package 阶段的 vite build 会清空 dist/，
            # 多平台产物必须放在 dist 之外，打包时再由 plugin-kit 合并收集
            mkdir -p "$p/backend/darwin-aarch64" "$p/backend/darwin-x86_64"
            cp "$p"/src-tauri/target/aarch64-apple-darwin/release/plugin_* "$p/backend/darwin-aarch64/"
            cp "$p"/src-tauri/target/x86_64-apple-darwin/release/plugin_* "$p/backend/darwin-x86_64/"
          done

      # windows-latest 自带的 Git Bash Perl 缺 Locale::Maketext::Simple，
      # 会导致 openssl-sys 源码构建失败；改用 Strawberry Perl（预装，含该模块）
      - name: Use Strawberry Perl for OpenSSL (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          if [ ! -d "/c/Strawberry/perl/bin" ]; then
            choco install strawberryperl -y --no-progress
          fi
          echo "C:\\Strawberry\\perl\\bin" >> $GITHUB_PATH
          echo "C:\\Strawberry\\c\\bin" >> $GITHUB_PATH

      - name: Build Plugin Backends (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        # openssl-src 优先读 PERL 环境变量定位 perl（比 PATH 可靠——
        # MSYS/Git Bash 的旧 perl 在 PATH 里始终排在 Strawberry 前）
        env:
          PERL: C:/Strawberry/perl/bin/perl.exe
        run: |
          "$PERL" -MLocale::Maketext::Simple -e 1 && echo "Perl 模块自检通过 (PERL=$PERL)"
          for p in package/*/; do
            [ -d "$p/src-tauri" ] || continue
            echo "==> backend: $p"
            (cd "$p/src-tauri" && cargo build --release)
            mkdir -p "$p/backend/windows-x86_64"
            cp "$p"/src-tauri/target/release/plugin_*.exe "$p/backend/windows-x86_64/"
          done

      - name: Build Plugin Backends (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          for p in package/*/; do
            [ -d "$p/src-tauri" ] || continue
            echo "==> backend: $p"
            (cd "$p/src-tauri" && cargo build --release)
            mkdir -p "$p/backend/linux-x86_64"
            cp "$p"/src-tauri/target/release/plugin_* "$p/backend/linux-x86_64/"
          done

      - name: Upload Plugin Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-backends-${{ matrix.platform }}
          path: package/*/backend/**
          retention-days: 7
          if-no-files-found: error

  release:
    name: package & publish
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 合并三平台后端产物回插件根 backend/<平台>/（artifact 内部为 <插件>/backend/<平台>/）
      - name: Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-backends-*
          path: merged-backends

      - name: Merge Artifacts Into Layout
        run: |
          set -o pipefail
          for dir in merged-backends/*/; do
            cp -R "$dir." package/
          done
          # 显式断言：合并后必须存在平台子目录下的后端二进制，避免空产物静默通过
          files=$(find package -type f -path '*/backend/*/plugin_*')
          [ -n "$files" ] || { echo "::error::后端产物合并为空，请检查 artifact 内部目录结构"; exit 1; }
          echo "$files" | sort

      # 构建 plugin-kit（tsc），供后续 package 命令使用
      - name: Build plugin-kit
        run: |
          cd sdk/plugin-kit && npm ci && npm run build

      # 打包签名（--no-bump：版本以 package.json 为准，tag 前手动 bump）
      - name: Package & Sign Plugins
        env:
          SWALLOWNOTE_PLUGIN_SIGNING_KEY: ${{ secrets.SWALLOWNOTE_PLUGIN_SIGNING_KEY }}
        run: |
          # fail fast：签名密钥缺失时静默空签名会让发布产物被市场拒绝，
          # 与其 20 分钟后才发现不如立即失败
          if [ -z "$SWALLOWNOTE_PLUGIN_SIGNING_KEY" ]; then
            echo "::error::Secret SWALLOWNOTE_PLUGIN_SIGNING_KEY 未配置（Settings→Secrets→Actions），无法签名"
            exit 1
          fi

          # plugin-sdk 的 dist 入口被 .gitignore 忽略，须先构建（插件源码
          # import '@swallow-note/plugin-sdk'，无 dist 则 vite 解析失败）
          echo "==> build plugin-sdk"
          (cd sdk/plugin-sdk && npm ci --silent && npm run build --silent)

          # 打包前必须安装插件依赖：vite.config.ts 导入 @swallow-note/plugin-kit
          # （file:../../sdk/plugin-kit），未 install 时 vite 加载 config 即失败
          for p in package/*/; do
            name=$(basename "$p")
            [ -f "$p/package.json" ] || continue
            echo "==> npm install: $name"
            (cd "$p" && npm install --no-audit --no-fund 2>&1 | tail -1)
            echo "==> package: $name"
            (cd "$p" && node "$GITHUB_WORKSPACE/sdk/plugin-kit/dist/cli.js" package --no-bump)
          done

      - name: Verify Repo Index
        run: |
          find . -name "repo.json" -not -path "*/node_modules/*" | sort
          cat package/repo.json | head -30

      - name: Upload Plugin Packages to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            package/*/com.swallownote.*.zip
            package/repo.json
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
